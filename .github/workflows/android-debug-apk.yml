name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npm run build

      - name: Add & sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npm install @capacitor/core @capacitor/android
            npx cap add android
          fi
          npx cap sync android

      - name: Enforce landscape orientation on MainActivity
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "screenOrientation" "$MANIFEST"; then
            sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' "$MANIFEST"
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../app-debug.apk

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: solana-bay-debug-apk
          path: app-debug.apk
